server:
  port: ${PORT:8080}
  address: 0.0.0.0
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: ecovision-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      # Flyway owns production schema changes. "update" remains the default
      # temporarily for existing development databases and can be overridden
      # with JPA_HIBERNATE_DDL_AUTO=validate in production after the schema is
      # fully baselined.
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}
  google:
    client-id: ${GOOGLE_CLIENT_ID:dummy-client-id.apps.googleusercontent.com}
  storage:
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    upload-dir: ${UPLOAD_DIR:/tmp/uploads}

jwt:
  secret: ${JWT_SECRET}

gemini:
  model: ${GEMINI_MODEL:gemini-3.6-flash}
  connect-timeout-ms: ${GEMINI_CONNECT_TIMEOUT_MS:10000}
  read-timeout-ms: ${GEMINI_READ_TIMEOUT_MS:60000}

overpass:
  connect-timeout-ms: ${OVERPASS_CONNECT_TIMEOUT_MS:10000}
  read-timeout-ms: ${OVERPASS_READ_TIMEOUT_MS:60000}

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
