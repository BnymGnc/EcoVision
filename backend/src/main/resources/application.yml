server:
  port: 8080

spring:
  application:
    name: ecovision-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecovision}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  storage:
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    upload-dir: ${UPLOAD_DIR:uploads}
