server:
  port: ${PORT:8082}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: ecovision-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}
  google:
    client-id: ${GOOGLE_CLIENT_ID:dummy-client-id.apps.googleusercontent.com}
  storage:
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8082}
    upload-dir: ${UPLOAD_DIR:uploads}

jwt:
  secret: ${JWT_SECRET}

gemini:
  api:
    key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL:gemini-1.5-flash}

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
