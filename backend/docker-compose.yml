services:
  postgres:
    image: postgres:16
    container_name: ecovision-postgres
    environment:
      POSTGRES_DB: ecovision
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ecovision-postgres-data:/var/lib/postgresql/data

volumes:
  ecovision-postgres-data:
